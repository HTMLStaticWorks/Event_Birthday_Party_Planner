<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Catering Event & Birthday Party Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--obsidian-black), var(--deep-plum));
        }
        .auth-panel {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            z-index: 3;
            border: 1px solid rgba(242, 220, 162, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(139, 0, 139, 0.2);
        }
        .social-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--ivory);
            transition: all 0.3s;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--champagne-gold);
            border-color: var(--champagne-gold);
        }
        .auth-bg-layer {
            position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1519167758481-83f524fb7a4c?q=80&w=2069&auto=format&fit=crop') center/cover; opacity: 0.1; mix-blend-mode: overlay; z-index: 1;
        }
        .auth-controls {
            position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 15px;
        }
        .password-toggle {
            position: absolute; inset-inline-end: 15px; top: 40px; cursor: pointer; color: var(--glass-border);
        }
        .password-toggle:hover { color: var(--champagne-gold); }
        [dir="rtl"] .form-control { text-align: right; }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/images/website_logo.svg">
</head>
<body>
    <div class="auth-bg-layer"></div>
    <div class="glitter-bg" data-particles="60" style="z-index: 2;"></div>

    <div class="auth-controls">
        <button id="themeToggle" class="btn btn-link p-0 text-gold border-0 text-decoration-none bg-transparent">
            <i data-lucide="moon" width="24" height="24"></i>
        </button>
        <button id="rtlToggle" class="btn btn-link p-0 text-gold border-0 text-decoration-none bg-transparent">
            <i data-lucide="arrow-right-left" width="24" height="24"></i>
        </button>
    </div>

    <div class="auth-container p-3">
        <div class="glass-panel auth-panel text-center reveal-up active">
            <a href="index.html" class="text-gold text-decoration-none fs-4 fw-bold d-flex align-items-center justify-content-center gap-2 mb-2" style="font-family: var(--font-heading);"><img src="assets/images/website_logo.svg" alt="Logo" style="height: 40px; width: auto; border-radius: 8px;">LuxeEvents</a>
            <p class="text-muted small mb-4">Welcome back to your planning portal</p>

            <form action="dashboard.html" method="GET" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-muted small">Email Address</label>
                    <input type="email" class="form-control form-control-luxury" placeholder="eleanor@example.com" required>
                </div>
                <div class="mb-4 position-relative">
                    <label class="form-label text-muted small">Password</label>
                    <input type="password" class="form-control form-control-luxury" id="passwordInput" placeholder="••••••••" required>
                    <i data-lucide="eye" class="password-toggle" id="togglePassword" width="18"></i>
                </div>
                
                <div class="d-flex justify-content-between align-items-center flex-nowrap gap-2 mb-4 small">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-gold text-decoration-none hover-gold text-nowrap">Forgot password?</a>
                </div>


                <button type="submit" class="btn btn-primary-luxury w-100 mb-4 py-2">Sign In</button>
            </form>

            <div class="d-flex align-items-center mb-4">
                <hr class="flex-grow-1" style="border-color: var(--glass-border);">
                <span class="px-3 small text-muted">or continue with</span>
                <hr class="flex-grow-1" style="border-color: var(--glass-border);">
            </div>

            <div class="d-flex justify-content-between gap-3 mb-4">
                <button class="btn social-btn flex-grow-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg></button>
                <button class="btn social-btn flex-grow-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="18px" height="18px" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></button>
            </div>

            <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="text-gold text-decoration-none fw-bold">Create one</a></p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                this.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
